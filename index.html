<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>90+</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- APP -->
    <div id="app-wrapper">

        <!-- Ambient -->
        <div class="ambient-glow ambient-top-left"></div>
        <div class="ambient-glow-2 ambient-bottom-right"></div>

        <!-- ========================================================= -->
        <!-- TOAST -->
        <!-- ========================================================= -->
        <div id="toast-container">
            <div class="toast-inner">
                <div id="toast-icon"></div>
                <div id="toast-text"></div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- CONFIRM MODAL -->
        <!-- ========================================================= -->
        <div id="confirm-modal">
            <div id="confirm-card">

                <div class="confirm-icon">
                    <i data-lucide="shield-alert"></i>
                </div>

                <h2 id="confirm-title">Confirmar</h2>
                <p id="confirm-desc">
                    ¿Estás seguro?
                </p>

                <div class="confirm-actions">
                    <button class="btn-cancel" onclick="closeConfirm(false)">
                        CANCELAR
                    </button>

                    <button class="btn-confirm-danger" onclick="closeConfirm(true)">
                        CONFIRMAR
                    </button>
                </div>

            </div>
        </div>

        <!-- ========================================================= -->
        <!-- WELCOME SCREEN -->
        <!-- ========================================================= -->
        <section id="screen-welcome" class="screen active">

            <div>

                <!-- LOGO -->
                <div class="welcome-logo-wrap">

                    <div class="welcome-logo-glow"></div>

                    <h1 class="welcome-logo">
                        90<span>+</span>
                    </h1>

                </div>

                <!-- TEXT -->
                <div class="welcome-content">

                    <div class="welcome-badge">
                        <div class="badge-dot"></div>
                        FOOTBALL CAREER
                    </div>

                    <h2 class="welcome-title">
                        Documentá tu carrera.
                    </h2>

                    <p class="welcome-subtitle">
                        Entrenamientos, partidos, objetivos y evolución
                        personal en una experiencia premium.
                    </p>

                </div>

            </div>

            <!-- BUTTON -->
            <button class="btn-start" onclick="goTo('welcome','profile')">

                <span>INICIAR CARRERA</span>

                <i data-lucide="arrow-right"></i>

            </button>

        </section>

        <!-- ========================================================= -->
        <!-- PROFILE SCREEN -->
        <!-- ========================================================= -->
        <section id="screen-profile" class="screen hidden-right">

            <div class="screen-header">

                <div>
                    <h2 class="screen-title">
                        Perfil
                    </h2>

                    <p class="screen-subtitle">
                        Construí tu identidad futbolística.
                    </p>
                </div>

                <div class="step-badge">
                    PASO 1
                </div>

            </div>

            <!-- CLUB -->
            <div class="form-group">

                <label class="form-label">
                    CLUB
                </label>

                <input
                    id="club-name"
                    type="text"
                    class="form-input"
                    placeholder="Club Atlético..."
                />

            </div>

            <!-- POSITION -->
            <div class="form-group">

                <label class="form-label">
                    POSICIÓN
                </label>

                <div class="select-wrap">

                    <select id="position" class="form-select">

                        <optgroup label="ARQUEROS">
                            <option value="">Seleccionar</option>
                            <option>Arquero</option>
                            <option>Arquero Líbero</option>
                        </optgroup>

                        <optgroup label="DEFENSAS">
                            <option>Lateral Derecho</option>
                            <option>Lateral Izquierdo</option>
                            <option>Defensor Central</option>
                            <option>Líbero</option>
                            <option>Carrilero Derecho</option>
                            <option>Carrilero Izquierdo</option>
                        </optgroup>

                        <optgroup label="MEDIOCAMPO">
                            <option>Mediocentro</option>
                            <option>Volante Defensivo</option>
                            <option>Interior Derecho</option>
                            <option>Interior Izquierdo</option>
                            <option>Enganche</option>
                            <option>Mediocampista Ofensivo</option>
                        </optgroup>

                        <optgroup label="ATAQUE">
                            <option>Extremo Derecho</option>
                            <option>Extremo Izquierdo</option>
                            <option>Segundo Delantero</option>
                            <option>Delantero Centro</option>
                            <option>Falso 9</option>
                        </optgroup>

                    </select>

                    <i data-lucide="chevron-down"></i>

                </div>

            </div>

            <!-- HEIGHT / WEIGHT -->
            <div class="double-grid">

                <div>

                    <label class="form-label">
                        ALTURA
                    </label>

                    <input
                        id="height"
                        type="number"
                        class="form-input"
                        placeholder="178"
                    />

                </div>

                <div>

                    <label class="form-label">
                        PESO
                    </label>

                    <input
                        id="weight"
                        type="number"
                        class="form-input"
                        placeholder="72"
                    />

                </div>

            </div>

            <!-- IMC -->
            <div class="imc-box">

                <div>
                    <p class="imc-label">IMC</p>
                    <h3 id="imc-value">--</h3>
                </div>

                <div class="imc-status" id="imc-status">
                    Balanceado
                </div>

            </div>

            <!-- SKILLS -->
            <div class="skills-wrap">

                <label class="form-label">
                    HABILIDADES PRINCIPALES
                </label>

                <div class="double-grid">

                    <select id="attr-1" class="form-select">
                        <option value="">Primera habilidad</option>
                        <option>Velocidad</option>
                        <option>Definición</option>
                        <option>Regate</option>
                        <option>Visión</option>
                        <option>Pase</option>
                        <option>Resistencia</option>
                        <option>Fuerza</option>
                        <option>Marcaje</option>
                        <option>Anticipación</option>
                    </select>

                    <select id="attr-2" class="form-select">
                        <option value="">Segunda habilidad</option>
                        <option>Velocidad</option>
                        <option>Definición</option>
                        <option>Regate</option>
                        <option>Visión</option>
                        <option>Pase</option>
                        <option>Resistencia</option>
                        <option>Fuerza</option>
                        <option>Marcaje</option>
                        <option>Anticipación</option>
                    </select>

                </div>

                <div style="margin-top: .75rem;">

                    <select id="attr-3" class="form-select">
                        <option value="">
                            Tercera habilidad (Opcional)
                        </option>

                        <option>Velocidad</option>
                        <option>Definición</option>
                        <option>Regate</option>
                        <option>Visión</option>
                        <option>Pase</option>
                        <option>Resistencia</option>
                        <option>Fuerza</option>
                        <option>Marcaje</option>
                        <option>Anticipación</option>
                    </select>

                </div>

            </div>

            <!-- BUTTON -->
            <button class="btn-green" onclick="validateProfile()">

                CONTINUAR

                <i data-lucide="arrow-right"></i>

            </button>

        </section>

    </div>

    <!-- SCRIPT -->
    <script src="main.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
