<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camino a Primera</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="app-wrapper">
  <!-- AMBIENT -->
  <div class="ambient ambient-top"></div>
  <div class="ambient ambient-bottom"></div>

  <!-- TOAST -->
  <div id="toast-container">
    <div class="toast-inner">
      <div id="toast-icon"></div>
      <div id="toast-text"></div>
    </div>
  </div>

  <!-- WELCOME -->
  <section id="screen-welcome" class="screen active">
    <div class="welcome-top">
      <div class="welcome-logo"><i data-lucide="shield"></i></div>
      <div class="welcome-badge">NUEVA GENERACIÓN</div>
    </div>
    <div class="welcome-content">
      <h1 class="welcome-title">Camino a <span>Primera</span></h1>
      <p class="welcome-subtitle">Registrá entrenamientos, partidos, estadísticas y construí tu carrera hacia el fútbol profesional.</p>
    </div>
    <div class="welcome-bottom">
      <button class="btn-green" onclick="goTo('welcome','profile')">
        COMENZAR <i data-lucide="arrow-right"></i>
      </button>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="screen-dashboard" class="screen hidden-right no-scrollbar">
    <div class="hero-card" style="text-align:center; padding:2rem 1rem;">
      <div class="progress-donut">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="42"/>
          <circle class="progress" id="progress-circle" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"/>
        </svg>
        <div class="progress-percentage">
          <div id="progress-text">0%</div>
        </div>
      </div>
      <div id="dash-player-name" style="font-size:1.8rem;font-weight:900;margin-top:1rem"></div>
    </div>

    <button class="register-trigger" onclick="openRegisterModal()">
      <div>
        <div class="register-trigger-title">Registrar día</div>
        <div class="register-trigger-sub">Entrenamiento o partido</div>
      </div>
      <div class="register-trigger-icon"><i data-lucide="plus"></i></div>
    </button>

    <div class="feed-header"><div class="feed-title">HISTORIAL</div></div>
    <div id="journal-feed"></div>
  </section>

  <!-- NAV -->
  <nav id="app-nav" class="visible">
    <button id="nav-dash" class="nav-btn active" onclick="navigate('dash')"><i data-lucide="house"></i>Inicio</button>
    <button id="nav-stats" class="nav-btn" onclick="navigate('stats')"><i data-lucide="bar-chart-3"></i>Stats</button>
    <button id="nav-settings" class="nav-btn" onclick="navigate('settings')"><i data-lucide="settings-2"></i>Ajustes</button>
  </nav>
</div>

<script src="main.js"></script>
</body>
</html>
