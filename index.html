<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camino a Primera</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para el ícono de la flecha -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Pantalla de Inicio -->
    <section id="screen-home" class="screen active">
        <!-- Contenedor del logo 90+ -->
        <div class="t90-container">
            <div class="t90-circle">
                <span class="t90-text">90+</span>
            </div>
        </div>

        <div class="content-wrapper">
            <h1 id="titulo-camino">Camino a <br><span class="texto-verde">Primera</span></h1>
            <p id="texto-subtitulo">Registrá entrenamientos, partidos, estadísticas y construí tu carrera hacia el fútbol profesional.</p>
            
            <button id="btn-comenzar" class="main-btn">
                COMENZAR <i class="fas fa-arrow-right"></i>
            </button>
            
            <p class="footer-text">Cada día cuenta.</p>
        </div>
    </section>

    <!-- Pantalla del Dashboard (con el ID corregido) -->
    <section id="screen-dash" class="screen" style="display: none;">
        <div class="content-wrapper">
            <h1>Dashboard</h1>
            <p>Acá van tus estadísticas.</p>
            <br>
            <!-- Botón para reiniciar y probar la app desde cero -->
            <button onclick="cerrarSesion()" class="main-btn" style="background-color: #ff3333; color: white;">Cerrar Sesión</button>
        </div>
    </section>

    <!-- v=5 para evitar que el navegador use la caché vieja -->
    <script src="main.js?v=5"></script>
</body>
</html>
